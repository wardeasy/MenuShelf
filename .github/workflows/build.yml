name: Build macOS app
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify development app
        run: bash build.sh --ad-hoc
      - name: Smoke test
        run: ./build/MenuShelf.app/Contents/MacOS/MenuShelf --self-test
      - name: Check helper scripts
        run: |
          bash -n build.sh scripts/install.sh
          python3 -m py_compile scripts/login-item.py
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent build/MenuShelf.app build/MenuShelf-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MenuShelf-development
          path: build/MenuShelf-development.zip
